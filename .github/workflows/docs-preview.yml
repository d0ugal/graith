name: Docs Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'website/**'
      - 'cmd/ciclassify/**'
      - 'cmd/docsdiff/**'
      - 'cmd/docspreview/**'
      - 'internal/ciworkflow/**'
      - 'internal/docspreview/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/ci-tool-versions.env'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-preview.yml'
      - 'scripts/install-dart-sass.sh'
      - 'scripts/install-hugo.sh'
      - 'scripts/render-session-navigator-doc-screenshots.sh'
  # Safety-net prune of stale screenshot dirs (in case an on-close cleanup
  # was ever missed — dropped event, deleted PR, etc.).
  schedule:
    - cron: '17 4 * * *'

# Screenshots are published to an orphan `screenshots` branch and linked
# from a sticky PR comment. Same-repo PRs only (fork PRs get a read-only
# token and cannot push the branch or comment).
permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.event.pull_request.number || github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect docs-preview-relevant changes
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
      global: ${{ steps.filter.outputs.global }}
      trigger: ${{ steps.filter.outputs.trigger }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"; then
            {
              echo "build=true"
              echo "global=false"
              echo "trigger=true"
            } >> "$GITHUB_OUTPUT"
            echo "Could not list PR files; running the Hugo build to be safe."
            exit 0
          fi
          if ! classification="$(go run ./cmd/ciclassify -mode docs-preview <<<"$files")"; then
            {
              echo "build=true"
              echo "global=false"
              echo "trigger=true"
            } >> "$GITHUB_OUTPUT"
            echo "Shared classifier failed; running the Hugo build to be safe."
            exit 0
          fi
          echo "$classification" >> "$GITHUB_OUTPUT"
          if grep -qx 'build=true' <<<"$classification"; then
            echo "Docs-preview-relevant files changed: running the Hugo build."
          else
            echo "No docs-preview-relevant files changed: skipping docs preview."
          fi

  preview:
    name: Screenshot changed pages
    needs: changes
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      (needs.changes.result != 'success' || needs.changes.outputs.trigger != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pushes screenshots to the orphan branch and upserts the sticky PR comment.
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Screenshots are pushed via the Go helper's GITHUB_TOKEN, not the
          # checkout's persisted credentials.
          persist-credentials: false

      - name: Load CI tool versions
        run: grep -E '^(DART_SASS_VERSION|DART_SASS_LINUX_X64_SHA256|HUGO_VERSION|HUGO_LINUX_AMD64_DEB_SHA256|K6_IMAGE|GOVULNCHECK_VERSION)=' .github/ci-tool-versions.env >> "$GITHUB_ENV"

      - name: Install Hugo (extended) + Dart Sass
        run: |
          scripts/install-hugo.sh "$HUGO_VERSION" "$HUGO_LINUX_AMD64_DEB_SHA256"
          scripts/install-dart-sass.sh "$DART_SASS_VERSION" "$DART_SASS_LINUX_X64_SHA256" "${{ runner.temp }}/dart-sass"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Use the repository toolchain for the website's nested Go module.
          go-version-file: go.mod

      - name: Determine changed pages
        id: changed
        # Pass the PR/context values via env rather than interpolating
        # `${{ ... }}` straight into the shell body — they never touch the
        # script as code, only as data (defends against template injection if
        # a future field here is attacker-influenced).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          CLASSIFIER_BUILD: ${{ needs.changes.outputs.build }}
          CLASSIFIER_GLOBAL: ${{ needs.changes.outputs.global }}
        run: |
          BASE="$BASE_SHA"
          HEAD="$HEAD_SHA"
          if changed="$(git diff --name-only "$BASE" "$HEAD" -- \
            website/ \
            cmd/ciclassify/ \
            cmd/docsdiff/ \
            cmd/docspreview/ \
            internal/ciworkflow/ \
            internal/docspreview/ \
            Makefile \
            go.mod \
            go.sum \
            .github/ci-tool-versions.env \
            .github/workflows/docs.yml \
            .github/workflows/docs-preview.yml \
            scripts/install-dart-sass.sh \
            scripts/install-hugo.sh \
            scripts/render-session-navigator-doc-screenshots.sh)"; then
            detector_failed=0
          else
            detector_failed=1
            changed=""
            echo "Could not determine docs-preview changed files; running the Hugo build to be safe."
          fi
          echo "Docs-preview relevant changes:"; echo "$changed"

          build=0
          classifier_build="${CLASSIFIER_BUILD:-true}"
          classifier_global="${CLASSIFIER_GLOBAL:-false}"

          # A change to theme/config/layout/assets/data affects every page.
          global=0
          if [ "$classifier_global" = "true" ] || [ "$detector_failed" = 1 ] || grep -qE '^website/(\.ci/|archetypes/|assets/|config/|data/|hugo\.toml|go\.(mod|sum)|i18n/|layouts/|static/|themes/)' <<<"$changed"; then
            global=1
          fi
          ci_tool_versions_changed=0
          if grep -qx '.github/ci-tool-versions.env' <<<"$changed"; then
            ci_tool_versions_changed=1
          fi

          # Website tooling and workflow changes still need the production Hugo
          # validation path, even when they do not map to a specific screenshot.
          if [ "$classifier_build" != "false" ] || [ "$global" = 1 ] || grep -qE '^website/|^cmd/(ciclassify|docsdiff|docspreview)/|^internal/(ciworkflow|docspreview)/|^Makefile$|^go\.(mod|sum)$|^\.github/(ci-tool-versions\.env|workflows/(docs|docs-preview)\.yml)$|^scripts/(install-(dart-sass|hugo)|render-session-navigator-doc-screenshots)\.sh$' <<<"$changed"; then
            build=1
          fi

          emit() { # path, deleted -> {"url","name","hasBase","deleted"}
            local f="$1" deleted="$2" rel url name hasBase
            rel="${f#website/content/docs/}"; rel="${rel%.md}"
            if [ "$rel" = "_index" ]; then
              url="/docs/"; name="docs-home"
            elif [[ "$rel" == */_index ]]; then
              rel="${rel%/_index}"
              url="/docs/${rel}/"; name="${rel//\//-}"
            else
              # Flatten any nested path so the screenshot/diff filenames stay in
              # a single flat dir (screenshot.js writes /out/<name>-<vp>.png and
              # a `/` would need a subdir that isn't created).
              url="/docs/${rel}/"; name="${rel//\//-}"
            fi
            # Does this page exist at the base commit? If not it's new in this
            # PR — there's no baseline to diff against, so it renders in full.
            if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then hasBase=true; else hasBase=false; fi
            # jq -n --arg keeps the JSON well-formed even if a filename contains
            # characters that would break a hand-built string.
            jq -nc --arg url "$url" --arg name "$name" \
              --argjson hasBase "$hasBase" --argjson deleted "$deleted" \
              '{url:$url,name:$name,hasBase:$hasBase,deleted:$deleted}'
          }

          {
            if [ "$global" = 1 ]; then
              find website/content/docs -name '*.md' -print | sort | while read -r f; do
                emit "$f" false
              done
            else
              # `|| true` so a no-match grep doesn't abort the step under
              # `set -o pipefail` (e.g. a website/** change that touches no
              # doc page — the job should no-op, not fail).
              { echo "$changed" | grep -E '^website/content/docs/.*\.md$' || true; } | while read -r f; do
                [ -n "$f" ] || continue
                if [ -f "$f" ]; then
                  emit "$f" false
                elif git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then
                  # Gone from head but present at base — deleted in this PR.
                  emit "$f" true
                fi
              done
              # The committed graph data renders on one specific nested page.
              # Include it when regeneration is the only website change.
              if grep -qx 'website/data/package_dependencies.json' <<<"$changed"; then
                emit "website/content/docs/contributing/package-dependencies.md" false
              fi
              # CI tool changes can affect screenshot tooling without touching a
              # specific docs page. Exercise one stable page so k6 image updates
              # are pulled and run before Renovate can merge them.
              if [ "$ci_tool_versions_changed" = 1 ]; then
                emit "website/content/docs/_index.md" false
              fi
            fi
          } | jq -s '
            group_by(.url) |
            map({
              url: .[0].url,
              name: .[0].name,
              hasBase: (map(.hasBase) | any),
              deleted: (map(.deleted) | all)
            })
          ' > pages.json

          count="$(jq 'length' pages.json)"
          basecount="$(jq '[.[] | select(.hasBase)] | length' pages.json)"
          if [ "$count" != "0" ]; then
            build=1
          fi
          {
            echo "build=$build"
            echo "global=$global"
            echo "count=$count"
            echo "basecount=$basecount"
          } >> "$GITHUB_OUTPUT"
          echo "Build required: $build"
          echo "Pages to screenshot ($count, $basecount with a baseline):"; cat pages.json

      # Build the site twice — once at the PR's base commit, once at its head —
      # with the same pinned Hugo, so unchanged content renders identically and
      # the row diff aligns. The base build is skipped when every changed page
      # is new (no baseline to diff against).
      - name: Build head + base sites
        if: steps.changed.outputs.build == '1'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASECOUNT: ${{ steps.changed.outputs.basecount }}
        run: |
          (cd website && go test ./... && node --test tests/*.test.mjs)
          make package-graph-check
          hugo --gc --minify --baseURL "${BASE_URL}/" \
            --source website --destination "$PWD/site-head"
          if [ "$BASECOUNT" != "0" ]; then
            git worktree add --detach /tmp/base-tree "$BASE_SHA"
            # Keep previews working when comparing this rollout with a base
            # from before the generated data was committed. Newer bases always
            # render their own checked-in artifact.
            if [ ! -f /tmp/base-tree/website/data/package_dependencies.json ]; then
              mkdir -p /tmp/base-tree/website/data
              cp website/data/package_dependencies.json \
                /tmp/base-tree/website/data/package_dependencies.json
            fi
            hugo --gc --minify --baseURL "${BASE_URL}/" \
              --source /tmp/base-tree/website --destination "$PWD/site-base"
          fi

      - name: Screenshot head + base with k6 (Chromium)
        if: steps.changed.outputs.count != '0'
        env:
          BASECOUNT: ${{ steps.changed.outputs.basecount }}
        run: |
          # Serve a built site and screenshot the given page set into $out.
          # Always uses the head checkout's screenshot.js so both renders are
          # captured identically regardless of what the base commit shipped.
          shoot() { # $1=site dir  $2=out dir  $3=pages json
            python3 -m http.server 8080 --directory "$1" &
            local pid=$!
            for _ in $(seq 1 40); do
              curl -sf "$BASE_URL/docs/" >/dev/null && break
              sleep 0.5
            done
            mkdir -p "$2" && chmod 777 "$2"
            docker run --rm --network host \
              -e K6_BROWSER_HEADLESS=true \
              -e K6_BROWSER_ARGS=no-sandbox \
              -e BASE_URL="$BASE_URL" \
              -e PAGES="$(cat "$3")" \
              -v "$PWD/website/.ci/screenshot.js:/screenshot.js:ro" \
              -v "$2:/out" \
              "$K6_IMAGE" run /screenshot.js
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          # Head render skips deleted pages (they 404 at head); base render
          # covers everything with a baseline, including the deleted ones.
          jq '[.[] | select(.deleted | not)]' pages.json > head-pages.json
          shoot "$PWD/site-head" "$PWD/shots/head" head-pages.json
          if [ "$BASECOUNT" != "0" ]; then
            jq '[.[] | select(.hasBase)]' pages.json > base-pages.json
            shoot "$PWD/site-base" "$PWD/shots/base" base-pages.json
          fi
          sudo chown -R "$(id -u):$(id -g)" shots
          ls -R shots

      - name: Build diffs
        if: steps.changed.outputs.count != '0'
        run: |
          go run ./cmd/docsdiff \
            pages.json "$PWD/shots/base" "$PWD/shots/head" "$PWD/shots/out"
          echo "Published diff assets:"; ls -la shots/out

      - name: Publish screenshots and comment
        # This trusted-base YAML guard is intentional: fork PRs still render and
        # diff, but the write-token branch/comment mutation helper is not run
        # from fork-controlled checkouts.
        if: steps.changed.outputs.count != '0' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/docspreview publish

      - name: Skip screenshot publish for fork PRs
        if: steps.changed.outputs.count != '0' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Fork PR — screenshots are published only for same-repo PRs (fork PRs get a read-only token). Skipping publish."

  cleanup:
    name: Clean up screenshots
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Rewrites the screenshots branch and updates the sticky PR comment.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Only the docs-preview Go command is needed — check it out sparsely
      # (screenshots are read/written via the API, never the working tree) and
      # don't persist git credentials. Pin to the PR *base* SHA: this job runs
      # with a write-scoped token and then executes checked-out code, so it
      # must run the trusted base version, never PR-controlled code from the
      # default merge ref (the workflow YAML itself is already taken from the
      # base).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            cmd/docspreview
            internal/docspreview
            go.mod
            go.sum
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Remove PR screenshots from the screenshots branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/docspreview cleanup

  prune:
    name: Prune stale screenshots
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Rewrites the screenshots branch only (no PR comment on the schedule run).
    permissions:
      contents: write
    steps:
      # Only the docs-preview Go command is needed — see the cleanup job's
      # checkout note.
      # No `ref` pin needed here: the schedule trigger checks out the default
      # branch (trusted), never PR-controlled content.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            cmd/docspreview
            internal/docspreview
            go.mod
            go.sum
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Remove screenshot dirs older than 30 days
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/docspreview prune
