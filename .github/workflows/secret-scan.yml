name: Secret Scan

# Secret scanning for the supply-chain hardening in #697. Two complementary
# detectors run as a fast PR/push gate, plus a scheduled full-history sweep:
#   - TruffleHog with --only-verified (live-credential verification, low noise)
#   - Gitleaks (regex/entropy detectors — catches things TruffleHog doesn't)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily full-history sweep to catch anything a diff-scoped PR/push scan
    # missed (e.g. a secret introduced then reverted within a branch).
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the scheduled/push scan can walk commit ranges and
          # PR scans can diff base..head.
          fetch-depth: 0
          persist-credentials: false
      - name: Load CI tool versions
        run: grep -E '^(TRUFFLEHOG_IMAGE)=' .github/ci-tool-versions.env >> "$GITHUB_ENV"
      - name: TruffleHog (verified secrets only)
        env:
          COMMIT_IDS: ${{ toJson(github.event.commits.*.id) }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$TRUFFLEHOG_IMAGE" =~ ^ghcr[.]io/trufflesecurity/trufflehog:[0-9]+[.][0-9]+[.][0-9]+@sha256:[a-f0-9]{64}$ ]]; then
            echo "::error title=Invalid TruffleHog pin::TRUFFLEHOG_IMAGE must include a reviewed tag and sha256 digest."
            exit 1
          fi

          tagged_image="${TRUFFLEHOG_IMAGE%@*}"
          image_repo="${tagged_image%:*}"
          image_digest="${TRUFFLEHOG_IMAGE##*@}"
          immutable_image="${image_repo}@${image_digest}"

          base=""
          head=""
          case "$EVENT_NAME" in
            push)
              if [ "$COMMIT_IDS" = "[]" ]; then
                echo "No commits to scan"
                exit 0
              fi
              if [ -z "$EVENT_AFTER" ]; then
                echo "::error title=Missing TruffleHog range::Push event did not include a head commit."
                exit 1
              fi
              head="$EVENT_AFTER"
              if [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
                base="$EVENT_BEFORE"
              fi
              ;;
            pull_request)
              if [ -z "$PR_BASE_SHA" ] || [ -z "$PR_HEAD_SHA" ]; then
                echo "::error title=Missing TruffleHog range::Pull request event did not include base and head commits."
                exit 1
              fi
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            schedule|workflow_dispatch)
              ;;
            *)
              echo "::error title=Unsupported TruffleHog event::Unsupported event '$EVENT_NAME'."
              exit 1
              ;;
          esac

          if [ -n "$base" ] && [ "$base" = "$head" ]; then
            echo "::error title=Empty TruffleHog range::Base and head commits are the same."
            exit 1
          fi

          args=(git file:///repo/ --fail --no-update --github-actions --only-verified)
          if [ -n "$base" ]; then
            args+=(--since-commit "$base")
          fi
          if [ -n "$head" ]; then
            args+=(--branch "$head")
          fi

          docker run --rm -v "$PWD:/repo:ro" -w /repo "$immutable_image" "${args[@]}"

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load CI tool versions
        run: grep -E '^(GITLEAKS_IMAGE)=' .github/ci-tool-versions.env >> "$GITHUB_ENV"
      - name: Gitleaks
        env:
          COMMIT_IDS: ${{ toJson(github.event.commits.*.id) }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail

          if [[ ! "$GITLEAKS_IMAGE" =~ ^ghcr[.]io/gitleaks/gitleaks:v[0-9]+[.][0-9]+[.][0-9]+@sha256:[a-f0-9]{64}$ ]]; then
            echo "::error title=Invalid Gitleaks pin::GITLEAKS_IMAGE must include a version tag and sha256 digest."
            exit 1
          fi

          tagged_image="${GITLEAKS_IMAGE%@*}"
          image_repo="${tagged_image%:*}"
          image_digest="${GITLEAKS_IMAGE##*@}"
          immutable_image="${image_repo}@${image_digest}"

          log_opts=""
          case "$EVENT_NAME" in
            push)
              if [ "$COMMIT_IDS" = "[]" ]; then
                echo "No commits to scan"
                exit 0
              fi
              if [ -z "$EVENT_AFTER" ]; then
                echo "::error title=Missing Gitleaks range::Push event did not include a head commit."
                exit 1
              fi
              if [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
                log_opts="${EVENT_BEFORE}..${EVENT_AFTER}"
              else
                log_opts="$EVENT_AFTER"
              fi
              ;;
            pull_request)
              if [ -z "$PR_BASE_SHA" ] || [ -z "$PR_HEAD_SHA" ]; then
                echo "::error title=Missing Gitleaks range::Pull request event did not include base and head commits."
                exit 1
              fi
              if [ "$PR_BASE_SHA" = "$PR_HEAD_SHA" ]; then
                echo "::error title=Empty Gitleaks range::Base and head commits are the same."
                exit 1
              fi
              log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            schedule|workflow_dispatch)
              ;;
            *)
              echo "::error title=Unsupported Gitleaks event::Unsupported event '$EVENT_NAME'."
              exit 1
              ;;
          esac

          args=(
            detect
            --redact
            -v
            --exit-code=2
            --report-format=sarif
            --report-path=/out/results.sarif
            --log-level=debug
            --no-banner
          )
          if [ -n "$log_opts" ]; then
            args+=(--log-opts="$log_opts")
          fi

          output_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$output_dir"

          set +e
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v "$output_dir:/out" \
            -w /repo \
            --entrypoint sh \
            "$immutable_image" \
            -c 'git config --global --add safe.directory /repo && exec gitleaks "$@"' \
            sh "${args[@]}"
          status=$?
          set -e

          if [ "$status" -eq 2 ]; then
            echo "::error title=Gitleaks detected leaks::Review the redacted findings above and SARIF report at $output_dir/results.sarif."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error title=Gitleaks scan failed::gitleaks exited with status $status."
            exit "$status"
          fi
      - name: Upload Gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-results.sarif
          path: ${{ runner.temp }}/gitleaks/results.sarif
          if-no-files-found: ignore
