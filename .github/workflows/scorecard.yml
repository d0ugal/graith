name: Scorecard

# OpenSSF Scorecard — continuous scoring of the repo's supply-chain posture
# (action pinning, token permissions, branch protection, dangerous workflows,
# etc.). This is the ongoing north-star scorecard for the hardening in #697.
# Results are uploaded to code scanning and drive the Scorecard badge.

on:
  push:
    branches: [main]
  schedule:
    - cron: '19 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Upload the results to code scanning.
      security-events: write
      # Needed to publish results and get a badge (OIDC).
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Load CI tool versions
        run: grep -E '^(SCORECARD_IMAGE)=' .github/ci-tool-versions.env >> "$GITHUB_ENV"

      - name: Run analysis
        env:
          INPUT_INTERNAL_DEFAULT_TOKEN: ${{ github.token }}
          INPUT_INTERNAL_PUBLISH_BASE_URL: https://api.scorecard.dev
          INPUT_PUBLISH_RESULTS: "true"
          INPUT_REPO_TOKEN: ${{ github.token }}
          INPUT_RESULTS_FILE: results.sarif
          INPUT_RESULTS_FORMAT: sarif
        run: |
          set -euo pipefail

          if [[ ! "$SCORECARD_IMAGE" =~ ^ghcr[.]io/ossf/scorecard-action:v[0-9]+[.][0-9]+[.][0-9]+@sha256:[a-f0-9]{64}$ ]]; then
            echo "::error title=Invalid Scorecard pin::SCORECARD_IMAGE must include a version tag and sha256 digest."
            exit 1
          fi

          tagged_image="${SCORECARD_IMAGE%@*}"
          image_repo="${tagged_image%:*}"
          image_digest="${SCORECARD_IMAGE##*@}"
          immutable_image="${image_repo}@${image_digest}"

          docker run --rm \
            -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -e ACTIONS_ID_TOKEN_REQUEST_URL \
            -e GITHUB_ACTIONS \
            -e GITHUB_API_URL \
            -e GITHUB_EVENT_NAME \
            -e GITHUB_REF \
            -e GITHUB_REPOSITORY \
            -e GITHUB_SERVER_URL \
            -e GITHUB_SHA \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e GITHUB_EVENT_PATH=/github/event.json \
            -e INPUT_INTERNAL_DEFAULT_TOKEN \
            -e INPUT_INTERNAL_PUBLISH_BASE_URL \
            -e INPUT_PUBLISH_RESULTS \
            -e INPUT_REPO_TOKEN \
            -e INPUT_RESULTS_FILE \
            -e INPUT_RESULTS_FORMAT \
            -v "$PWD:/github/workspace" \
            -v "$GITHUB_EVENT_PATH:/github/event.json:ro" \
            -w /github/workspace \
            "$immutable_image"

      # Upload the results as an artifact for debugging / offline inspection.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Upload to code scanning so findings surface in the Security tab.
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
