name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'cmd/**/*.go'
      - 'internal/**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/ci-tool-versions.env'
      - '.github/workflows/docs.yml'
      - 'scripts/install-dart-sass.sh'
      - 'scripts/install-hugo.sh'
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment, don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    env:
      HUGO_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load CI tool versions
        run: grep -E '^(DART_SASS_VERSION|DART_SASS_LINUX_X64_SHA256|HUGO_VERSION|HUGO_LINUX_AMD64_DEB_SHA256|K6_IMAGE|GOVULNCHECK_VERSION)=' .github/ci-tool-versions.env >> "$GITHUB_ENV"
      - name: Install Hugo CLI (extended)
        run: scripts/install-hugo.sh "$HUGO_VERSION" "$HUGO_LINUX_AMD64_DEB_SHA256"
      - name: Install Dart Sass
        run: scripts/install-dart-sass.sh "$DART_SASS_VERSION" "$DART_SASS_LINUX_X64_SHA256" "${{ runner.temp }}/dart-sass"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Use the repository toolchain for the website's nested Go module.
          go-version-file: go.mod
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Test docs tooling
        working-directory: website
        run: |
          go test ./...
          node --test tests/*.test.mjs
      - name: Verify committed package dependency data
        run: make package-graph-check
      - name: Build site
        working-directory: website
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
