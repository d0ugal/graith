name: CI

on:
  push:
    branches: [main, 'release-please--branches--main']
  # No workflow-level paths filter: Lint / Test (ubuntu-latest) /
  # Test (macos-latest) are REQUIRED status checks, so this workflow must run
  # and report on every PR. A workflow skipped by path filtering never creates
  # its required contexts, leaving them permanently "expected" and blocking the
  # PR — with enforce_admins, unmergeably.
  #
  # macOS runner minutes are ~10x Linux and the hosted macOS pool is scarce, so
  # the macOS legs (Test/Integration on macos-latest) are instead gated
  # per-JOB via `if:` on the `changes` job below. A job skipped by `if:` still
  # reports a "skipped" conclusion, which branch protection treats as success —
  # so the required `Test (macos-latest)` context is satisfied on Go-only PRs
  # without spinning up a macOS runner. Only workflow-level skips strand a
  # required check; job-level skips do not. See issue #1174.
  pull_request:
  # Retained for ad hoc full-workflow diagnostics on an explicitly selected
  # branch; generated commits run through the normal pull_request trigger.
  workflow_dispatch:

permissions:
  contents: read

# Pull-request runs are expensive and become obsolete on the next push to the
# same PR. Non-PR events use a unique group so main, release-please, and manual
# diagnostics never cancel or serialize each other through this PR policy.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide whether the macOS legs need to run. These jobs run
  # `go test -race ./...` and integration compile checks on darwin, so they
  # matter when a change can compile or behave differently on macOS:
  #   - darwin-only-compiled Go: internal/pty (procstart_darwin.go) and
  #     internal/sandbox (safehouse/Seatbelt) — a Linux build never compiles
  #     these, so they'd otherwise get zero pre-merge coverage;
  #   - internal/daemon, which owns Darwin cgo FSEvents watcher code and macOS
  #     runtime branches;
  #   - integration tests, which may explicitly exercise Darwin runtime
  #     behaviour and need their macOS leg to validate the change itself;
  #   - the protocol/capability packages whose shapes the Swift conformance
  #     tests under gui/ validate, plus any Swift/GUI code;
  #   - the module graph (go.mod/go.sum) — a dependency or toolchain bump can
  #     break the darwin build alone;
  #   - this workflow itself.
  #
  # Deliberately NOT gated: high-churn Go packages whose only macOS-specific code
  # is *runtime* `runtime.GOOS == "darwin"` branches (internal/cli,
  # internal/store, internal/config, internal/covreport, …). Those compile on
  # Linux, so the Linux build/test still catches compile breaks; only the darwin
  # runtime *behaviour* goes unexercised pre-merge. That's an accepted trade-off
  # to keep scarce macOS minutes off the common Go-only PR — the push-to-main run
  # below (macos=true) is the safety net that turns main red if a darwin-only
  # regression slips through.
  #
  # Uses the PR files API rather than a local `git diff`: the checked-out
  # pull_request merge ref can be built against an older base than base.sha, so
  # a local diff surfaces the base branch's own commits and spuriously flips the
  # filter true. The API returns exactly the PR's changed files (same approach
  # as coverage.yml); the job checks out base.sha before running trusted Go
  # classifier code.
  changes:
    name: Detect macOS-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name == 'pull_request'
        with:
          go-version-file: go.mod
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Non-PR events (push to main) always run macOS: main must stay fully
          # green and there's no PR file list to inspect. Written generically so
          # any future non-PR trigger fails safe toward running.
          if [ "$EVENT" != "pull_request" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event ($EVENT): running macOS jobs."
            exit 0
          fi
          # Fail safe toward running macOS: if the file list can't be fetched,
          # run the jobs rather than silently skip a required check.
          if ! files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "Could not list PR files; running macOS jobs to be safe."
            exit 0
          fi
          if ! classification="$(go run ./cmd/ciclassify -mode ci <<<"$files")"; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "Shared classifier failed; running macOS jobs to be safe."
            exit 0
          fi
          echo "$classification" >> "$GITHUB_OUTPUT"
          if grep -qx 'macos=true' <<<"$classification"; then
            echo "macOS-relevant files changed: running macOS jobs."
          else
            echo "Go-only change: skipping macOS jobs."
          fi

  build:
    name: Build (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -v ./cmd/graith
      - name: Verify untagged fail-closed binaries
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin/arm64 linux/amd64 linux/arm64; do
            IFS=/ read -r goos goarch <<< "$target"
            binary="$RUNNER_TEMP/graith-${goos}-${goarch}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -o "$binary" ./cmd/graith
            scripts/libghostty-native.sh verify-default-binary "$binary"
          done

  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -v -race -count=1 ./...

      - name: Check component dependency direction
        run: make architecture-check
      - name: Test and verify package dependency graph
        run: |
          (cd website && go test -v -race -count=1 ./...)
          make package-graph-check
      - run: make demo-test

  test-macos:
    name: Test (macos-latest)
    needs: changes
    # Run when the detector says macOS is relevant — but also when the detector
    # itself did NOT cleanly succeed (failed/timed out). With `needs:` and a
    # custom `if:` lacking a status function, a *failed* `changes` job would
    # otherwise skip this job, and a skipped REQUIRED check counts as success —
    # a silent merge-gate bypass. Failing safe toward running closes that hole.
    # `!cancelled()` still lets a superseded run bow out (the newer run re-checks).
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.macos == 'true')
    runs-on: macos-latest
    # Cap scarce macOS runner minutes: a hang can't hold one for GitHub's 6h
    # default. Well above the normal test/integration runtime.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -v -race -count=1 ./...
      - run: make demo-test

  integration:
    name: Integration (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # PTY lifecycle execution requires the pinned native helper and runs in
      # the libghostty-native workflow; keep this job as a fast integration
      # compile gate for the ordinary (fail-closed) graph.
      - run: go test -v -race -count=1 -run '^$' -tags=integration ./internal/integration/...

  integration-macos:
    name: Integration (macos-latest)
    needs: changes
    # Run when the detector says macOS is relevant — but also when the detector
    # itself did NOT cleanly succeed (failed/timed out). With `needs:` and a
    # custom `if:` lacking a status function, a *failed* `changes` job would
    # otherwise skip this job, and a skipped REQUIRED check counts as success —
    # a silent merge-gate bypass. Failing safe toward running closes that hole.
    # `!cancelled()` still lets a superseded run bow out (the newer run re-checks).
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.macos == 'true')
    runs-on: macos-latest
    # Cap scarce macOS runner minutes: a hang can't hold one for GitHub's 6h
    # default. Well above the normal test/integration runtime.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # PTY lifecycle execution requires the pinned native helper and runs in
      # the libghostty-native workflow; keep this job as a fast integration
      # compile gate for the ordinary (fail-closed) graph.
      - run: go test -v -race -count=1 -run '^$' -tags=integration ./internal/integration/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint default and integration tags
        run: make lint-only
      # Lint non-cgo Darwin-only files too — the Linux lint above never compiles
      # them, so wsl_v5/etc. findings in *_darwin.go slip through (issue #784).
      - name: Lint Darwin non-cgo files
        run: make lint-darwin
      - name: Install checksum-verified Zig from the native dependency lock
        run: |
          set -euo pipefail
          zig_version="$(jq -er '.zig.version' libghostty-native.lock.json)"
          zig_url="$(jq -er '.zig.linuxX8664URL' libghostty-native.lock.json)"
          zig_sha256="$(jq -er '.zig.linuxX8664SHA256' libghostty-native.lock.json)"
          mkdir -p "${RUNNER_TEMP}/zig"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "$zig_url" --output "${RUNNER_TEMP}/zig.tar.xz"
          printf '%s  %s\n' "$zig_sha256" "${RUNNER_TEMP}/zig.tar.xz" | sha256sum --check --status
          tar -xf "${RUNNER_TEMP}/zig.tar.xz" -C "${RUNNER_TEMP}/zig" --strip-components=1
          echo "${RUNNER_TEMP}/zig" >> "$GITHUB_PATH"
          test "$("${RUNNER_TEMP}/zig/zig" version)" = "$zig_version"
      # Lint the supported Linux native surface against the pinned libghostty
      # artifact. Darwin native cgo remains validated by macOS build/test lanes
      # because Linux runners cannot practically cross-lint the Apple SDK slice.
      - name: Lint Linux libghostty tag
        run: make lint-libghostty

  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Load CI tool versions
        run: grep -E '^(HUGO_VERSION|K6_IMAGE|GOVULNCHECK_VERSION)=' .github/ci-tool-versions.env >> "$GITHUB_ENV"
      - run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - run: govulncheck ./...
