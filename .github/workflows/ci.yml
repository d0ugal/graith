name: CI

on:
  push:
    branches: [main, 'release-please--branches--main']
  # No workflow-level paths filter: Lint / Test (ubuntu-latest) /
  # Test (macos-latest) are REQUIRED status checks, so this workflow must run
  # and report on every PR. A workflow skipped by path filtering never creates
  # its required contexts, leaving them permanently "expected" and blocking the
  # PR — with enforce_admins, unmergeably.
  #
  # macOS runner minutes are ~10x Linux and the hosted macOS pool is scarce, so
  # the macOS legs (Test/Integration on macos-latest) are instead gated
  # per-JOB via `if:` on the `changes` job below. A job skipped by `if:` still
  # reports a "skipped" conclusion, which branch protection treats as success —
  # so the required `Test (macos-latest)` context is satisfied on Go-only PRs
  # without spinning up a macOS runner. Only workflow-level skips strand a
  # required check; job-level skips do not. See issue #1174.
  pull_request:
  # Retained for ad hoc full-workflow diagnostics on an explicitly selected
  # branch; generated commits run through the normal pull_request trigger.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decide whether the macOS legs need to run. These jobs run
  # `go test -race ./...` and integration compile checks on darwin, so they
  # matter when a change can compile or behave differently on macOS:
  #   - darwin-only-compiled Go: internal/pty (procstart_darwin.go) and
  #     internal/sandbox (safehouse/Seatbelt) — a Linux build never compiles
  #     these, so they'd otherwise get zero pre-merge coverage;
  #   - integration tests, which may explicitly exercise Darwin runtime
  #     behaviour and need their macOS leg to validate the change itself;
  #   - the protocol/capability packages whose shapes the Swift conformance
  #     tests under gui/ validate, plus any Swift/GUI code;
  #   - the module graph (go.mod/go.sum) — a dependency or toolchain bump can
  #     break the darwin build alone;
  #   - this workflow itself.
  #
  # Deliberately NOT gated: high-churn Go packages whose only macOS-specific code
  # is *runtime* `runtime.GOOS == "darwin"` branches (internal/daemon,
  # internal/cli, internal/store, internal/config, internal/covreport, …). Those
  # compile on Linux, so the Linux build/test still catches compile breaks; only
  # the darwin runtime *behaviour* goes unexercised pre-merge. That's an accepted
  # trade-off to keep scarce macOS minutes off the common Go-only PR — the
  # push-to-main run below (macos=true) is the safety net that turns main red if a
  # darwin-only regression slips through.
  #
  # Uses the PR files API rather than a local `git diff`: the checked-out
  # pull_request merge ref can be built against an older base than base.sha, so
  # a local diff surfaces the base branch's own commits and spuriously flips the
  # filter true. The API returns exactly the PR's changed files (same approach
  # as coverage.yml) and needs no checkout.
  changes:
    name: Detect macOS-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Non-PR events (push to main) always run macOS: main must stay fully
          # green and there's no PR file list to inspect. Written generically so
          # any future non-PR trigger fails safe toward running.
          if [ "$EVENT" != "pull_request" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event ($EVENT): running macOS jobs."
            exit 0
          fi
          # Fail safe toward running macOS: if the file list can't be fetched,
          # run the jobs rather than silently skip a required check.
          if ! files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "Could not list PR files; running macOS jobs to be safe."
            exit 0
          fi
          # here-string (not a pipe) so an early grep match can't SIGPIPE-fail an
          # upstream command under pipefail.
          if grep -Eq '^gui/|^demo/|^internal/integration/|^internal/protocol/|^internal/capabilities/|^internal/pty/|^internal/sandbox/|^Makefile$|^go\.mod$|^go\.sum$|\.swift$|^\.github/workflows/ci\.yml$' <<<"$files"; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "macOS-relevant files changed: running macOS jobs."
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
            echo "Go-only change: skipping macOS jobs."
          fi

  ci-shadow-summary:
    name: CI shadow summary
    needs: changes
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Detect changed files locally
        id: changed-files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/ci-shadow-changed-files.txt"
          errors="$RUNNER_TEMP/ci-shadow-detector-errors.txt"
          : > "$files"
          : > "$errors"
          exact=false

          fetch_commit() {
            local remote_url=$1
            local commit=$2
            git fetch --no-tags --depth=1 "$remote_url" "$commit"
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              fetch_commit "https://github.com/$BASE_REPOSITORY.git" "$BASE_SHA" || true
            fi
            if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
              git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
              git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$files"
              exact=true
            else
              echo "pull request base/head commits unavailable in local checkout" >> "$errors"
            fi
          elif [ "$EVENT_NAME" = "push" ] &&
            [ -n "$BEFORE_SHA" ] &&
            ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              fetch_commit "https://github.com/$BASE_REPOSITORY.git" "$BEFORE_SHA" || true
            fi
            if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null &&
              git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
              git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > "$files"
              exact=true
            else
              echo "push before/head commits unavailable in local checkout" >> "$errors"
            fi
          else
            echo "changed-file list unavailable for $EVENT_NAME" >> "$errors"
          fi

          {
            echo "files=$files"
            echo "errors=$errors"
            echo "exact=$exact"
          } >> "$GITHUB_OUTPUT"
      - name: Run local CI policy detector
        id: policy-plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          BASE_REF_NAME: ${{ github.base_ref }}
          HEAD_REF_NAME: ${{ github.head_ref }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXACT_FILE_LIST: ${{ steps.changed-files.outputs.exact }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
          DETECTOR_ERRORS: ${{ steps.changed-files.outputs.errors }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/ci-shadow-plan.json"
          plan_error="$RUNNER_TEMP/ci-shadow-plan.err"
          : > "$plan_error"

          tree="$(git rev-parse 'HEAD^{tree}')"
          ref="$GITHUB_REF"
          base_ref="$BASE_REF_NAME"
          head_ref="$HEAD_REF_NAME"
          args=(
            -manifest internal/cipolicy/manifest.json
            -event "$EVENT_NAME"
            -ref "$ref"
            -base-repository "$BASE_REPOSITORY"
            -head-repository "$HEAD_REPOSITORY"
            -commit "$HEAD_SHA"
            -tree "$tree"
            -output "$plan"
          )

          if [ -n "$base_ref" ]; then
            args+=(-base-ref "refs/heads/$base_ref")
          fi
          if [ -n "$head_ref" ]; then
            args+=(-head-ref "$head_ref")
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; then
              args+=(-fork)
            else
              args+=(-same-repository-agent)
            fi
          fi
          if [ "$EXACT_FILE_LIST" = "true" ]; then
            args+=(-changed-files "$CHANGED_FILES")
          fi

          while IFS= read -r detector_error; do
            if [ -n "$detector_error" ]; then
              args+=(-detector-error "$detector_error")
            fi
          done < "$DETECTOR_ERRORS"

          if ! go run ./cmd/cipolicy "${args[@]}" plan 2> "$plan_error"; then
            rm -f "$plan"
          fi

          {
            echo "plan=$plan"
            echo "plan-error=$plan_error"
          } >> "$GITHUB_OUTPUT"
      - name: Write CI shadow summary
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MACOS_DETECTOR_RESULT: ${{ needs.changes.result }}
          MACOS_DETECTOR_OUTPUT: ${{ needs.changes.outputs.macos }}
          PLAN_INPUT: ${{ steps.policy-plan.outputs.plan }}
          PLAN_ERROR: ${{ steps.policy-plan.outputs.plan-error }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          go run ./cmd/cipolicy \
            --inventory internal/cibaseline/inventory.json \
            --manifest internal/cipolicy/manifest.json \
            --plan-input "$PLAN_INPUT" \
            --plan-error "$PLAN_ERROR" \
            --changed-files "$CHANGED_FILES" \
            --event "$EVENT_NAME" \
            --ref "$REF" \
            --head-sha "$PR_HEAD_SHA" \
            --run-url "$RUN_URL" \
            --macos-detector-result "$MACOS_DETECTOR_RESULT" \
            --macos-detector-output "$MACOS_DETECTOR_OUTPUT" \
            summary \
            >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -v ./cmd/graith
      - name: Verify untagged fail-closed binaries
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin/arm64 linux/amd64 linux/arm64; do
            IFS=/ read -r goos goarch <<< "$target"
            binary="$RUNNER_TEMP/graith-${goos}-${goarch}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -o "$binary" ./cmd/graith
            scripts/libghostty-native.sh verify-default-binary "$binary"
          done

  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -v -race -count=1 ./...

      - name: Check component dependency direction
        run: make architecture-check
      - name: Test and verify package dependency graph
        run: |
          (cd website && go test -v -race -count=1 ./...)
          make package-graph-check
      - run: make demo-test

  test-macos:
    name: Test (macos-latest)
    needs: changes
    # Run when the detector says macOS is relevant — but also when the detector
    # itself did NOT cleanly succeed (failed/timed out). With `needs:` and a
    # custom `if:` lacking a status function, a *failed* `changes` job would
    # otherwise skip this job, and a skipped REQUIRED check counts as success —
    # a silent merge-gate bypass. Failing safe toward running closes that hole.
    # `!cancelled()` still lets a superseded run bow out (the newer run re-checks).
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.macos == 'true')
    runs-on: macos-latest
    # Cap scarce macOS runner minutes: a hang can't hold one for GitHub's 6h
    # default. Well above the normal test/integration runtime.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -v -race -count=1 ./...
      - run: make demo-test

  integration:
    name: Integration (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # PTY lifecycle execution requires the pinned native helper and runs in
      # the libghostty-native workflow; keep this job as a fast integration
      # compile gate for the ordinary (fail-closed) graph.
      - run: go test -v -race -count=1 -run '^$' -tags=integration ./internal/integration/...

  integration-macos:
    name: Integration (macos-latest)
    needs: changes
    # Run when the detector says macOS is relevant — but also when the detector
    # itself did NOT cleanly succeed (failed/timed out). With `needs:` and a
    # custom `if:` lacking a status function, a *failed* `changes` job would
    # otherwise skip this job, and a skipped REQUIRED check counts as success —
    # a silent merge-gate bypass. Failing safe toward running closes that hole.
    # `!cancelled()` still lets a superseded run bow out (the newer run re-checks).
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.macos == 'true')
    runs-on: macos-latest
    # Cap scarce macOS runner minutes: a hang can't hold one for GitHub's 6h
    # default. Well above the normal test/integration runtime.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # PTY lifecycle execution requires the pinned native helper and runs in
      # the libghostty-native workflow; keep this job as a fast integration
      # compile gate for the ordinary (fail-closed) graph.
      - run: go test -v -race -count=1 -run '^$' -tags=integration ./internal/integration/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: make lint-only
      # Lint Darwin-only files too — the Linux lint above never compiles them,
      # so wsl_v5/etc. findings in *_darwin.go slip through (issue #784).
      - run: make lint-darwin

  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - run: govulncheck ./...
