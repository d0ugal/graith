name: Commits

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commitsar:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load CI tool versions
        run: grep -E '^(COMMITSAR_VERSION)=' .github/ci-tool-versions.env >> "$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Commitsar
        run: |
          set -euo pipefail

          if [[ ! "$COMMITSAR_VERSION" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error title=Invalid Commitsar pin::COMMITSAR_VERSION must be a semver tag."
            exit 1
          fi

          bin_dir="$RUNNER_TEMP/commitsar-bin"
          mkdir -p "$bin_dir"
          # Clear GONOSUMDB so inherited private-module settings cannot bypass
          # the public checksum database for the pinned Commitsar module.
          GOBIN="$bin_dir" GONOSUMDB="" GOSUMDB=sum.golang.org go install "github.com/aevea/commitsar@$COMMITSAR_VERSION"
          go version -m "$bin_dir/commitsar" | awk -v version="$COMMITSAR_VERSION" '
            $1 == "mod" && $2 == "github.com/aevea/commitsar" && $3 == version { found = 1 }
            END { exit found ? 0 : 1 }
          '
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Conventional commits
        env:
          # Commitsar otherwise defaults to origin/master when a dispatch has
          # no GITHUB_BASE_REF. Use its supported GitLab-compatible variable
          # so the exact generated branch SHA is compared with main.
          CI_MERGE_REQUEST_TARGET_BRANCH_NAME: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
        run: commitsar --config-path=.
