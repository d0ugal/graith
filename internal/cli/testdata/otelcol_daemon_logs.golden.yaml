# Generated by `gr config render otelcol`.
# This file does not enable Graith telemetry, start a collector, or ship data by itself.
# Enable [telemetry.metrics] and [telemetry.tracing] in config.toml, then run `gr daemon restart`.
# Session scrollback logs are intentionally excluded. Daemon log tailing is included only with --include-daemon-logs.
# Queue/retry guidance: tune queue sizes, retry windows, and optional WAL/persistent queues for your backend.
# Requires otelcol-contrib, or a custom Collector distribution with prometheus and prometheus_remote_write; daemon logs also need file_log and file_storage.
# The remote exporter placeholders below read backend destinations and credentials from the collector process environment.

extensions:
  file_storage/graith:
    directory: "/home/braw/.local/share/graith/otelcol/file-storage"
    create_directory: true

receivers:
  prometheus/graith:
    config:
      scrape_configs:
        - job_name: "graith"
          scrape_interval: "15s"
          metrics_path: "/metrics"
          static_configs:
            - targets: ["127.0.0.1:4824"]

  otlp/graith:
    protocols:
      grpc:
        endpoint: "127.0.0.1:4317"
      http:
        endpoint: "127.0.0.1:4318"
        traces_url_path: "/v1/traces"

  file_log/graith_daemon:
    # Also requires the file_log receiver and file_storage extension from otelcol-contrib.
    include:
      - "/home/braw/.local/share/graith/daemon.log"
      - "/home/braw/.local/share/graith/daemon.stderr.log"
    start_at: end
    include_file_path: true
    storage: file_storage/graith
    attributes:
      graith.log.scope: daemon
    resource:
      service.name: graith-daemon
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  prometheus_remote_write/graith:
    endpoint: "${env:GRAITH_MIMIR_REMOTE_WRITE_URL}"
    headers:
      Authorization: "${env:GRAITH_MIMIR_AUTH_HEADER}"
    remote_write_queue:
      enabled: true
      queue_size: 10000
      num_consumers: 5
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 5m
    # For crash-resilient metrics delivery, create this directory and enable WAL:
    # wal:
    #   directory: "/home/braw/.local/share/graith/otelcol/prometheus-remote-write-wal"

  otlp_http/graith:
    endpoint: "${env:GRAITH_OTLP_HTTP_ENDPOINT}"
    headers:
      Authorization: "${env:GRAITH_OTLP_AUTH_HEADER}"
    sending_queue:
      enabled: true
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 5m

service:
  extensions: [file_storage/graith]
  pipelines:
    metrics/graith:
      receivers: [prometheus/graith]
      processors: [memory_limiter, batch]
      exporters: [prometheus_remote_write/graith]
    traces/graith:
      receivers: [otlp/graith]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/graith]
    logs/graith_daemon:
      receivers: [file_log/graith_daemon]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/graith]
